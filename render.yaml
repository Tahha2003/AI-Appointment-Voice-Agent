services:
  - type: web
    name: ai-appointment-voice-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/patients.db
